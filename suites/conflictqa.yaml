# ConflictQA: 94 synthesis questions over 1353 real web sources.
#
# Sources genuinely disagree — no timestamp or authority signal to resolve.
# Tests whether curation strategies can aggregate conflicting evidence.
#
# Data: kortukov/ConflictingQA (HuggingFace)
# N=94 with LLM-generated golden synthesis answers.
#
# Includes new auto-curation strategies:
#   - rag_adaptive: dynamic k per query
#   - compressed: LLM-based context compression
#   - cascade with cross-model verifier

name: conflictqa

corpus:
  loader: jsonl
  path: data/conflictqa/corpus.jsonl

dataset:
  path: data/conflictqa/questions.jsonl

strategies:
  - name: full_context
  - name: rag_embedding
    params: {k: 6}
  - name: rag_adaptive
    params: {k_min: 3, k_max: 12, ratio_threshold: 0.65}
  - name: hierarchical
    params: {max_ids: 5}
  - name: agent_managed
    params: {max_iter: 6}
  - name: cascade
    params:
      final_fallback: full
      verifier_model: claude-haiku-4-5
  - name: ensemble
    params:
      judge_model: claude-haiku-4-5
  - name: compressed
    params:
      mode: extract
      compress_model: claude-haiku-4-5

grader:
  kind: llm_judge
  model: claude-opus-4-7

frontier:
  axes: [quality, cost_usd, total_tokens]
  direction: [max, min, min]

models:
  agent: claude-sonnet-4-6
  judge: claude-opus-4-7
  proposer: claude-opus-4-7

concurrency: 8
