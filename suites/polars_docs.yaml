name: polars-docs

corpus:
  loader: jsonl
  path: data/polars/corpus.jsonl

dataset:
  path: data/polars/questions.jsonl

strategies:
  - name: full_context
  - name: rag_embedding
    params: {k: 6}
  - name: hierarchical
    params: {max_ids: 5}
  - name: thin_harness
    params: {max_iter: 3}
  - name: agent_managed
    params: {max_iter: 6}
  - name: thick_harness
    params: {max_iter: 5}
  - name: cascade
    params: {final_fallback: full}
  - name: ensemble
  - name: meta_harness

grader:
  kind: llm_judge
  model: claude-opus-4-7

frontier:
  axes: [quality, cost_usd, total_tokens]
  direction: [max, min, min]

optimize:
  strategy: meta_harness
  train_size: 4
  dev_size: 3
  iterations: 3

models:
  agent: claude-sonnet-4-6
  judge: claude-opus-4-7
  proposer: claude-opus-4-7

concurrency: 8
