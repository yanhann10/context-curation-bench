name: hr-living-docs

corpus:
  loader: jsonl
  path: data/corpus.jsonl

dataset:
  path: data/questions.jsonl

# Strategies is a list — the suite IS a matrix (novel vs letta-evals).
strategies:
  - name: full_context
  - name: rag_embedding
    params: {k: 6}
  - name: hierarchical
    params: {max_ids: 5}
  - name: agent_managed
    params: {max_iter: 6}
  - name: meta_harness

grader:
  kind: llm_judge
  model: claude-opus-4-7

# Pareto frontier report over these axes (novel vs letta-evals `gate:`).
frontier:
  axes: [quality, cost_usd, total_tokens]
  direction: [max, min, min]

# Built-in optimize phase: propose/evaluate/keep-best over CurationSpec.
optimize:
  strategy: meta_harness
  train_size: 4
  iterations: 3

models:
  agent: claude-sonnet-4-6
  judge: claude-opus-4-7
  proposer: claude-opus-4-7

concurrency: 8
